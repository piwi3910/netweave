name: Dependency Scanning

on:
  push:
    branches: [main, develop]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/dependency-scan.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/dependency-scan.yml'
  schedule:
    # Run weekly on Monday at 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  # Snyk vulnerability scanning
  snyk-scan:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.25.9'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@9adf32b1121593767fc3c057af55b55db032dc04  # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3.35.2
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

      - name: Generate Snyk report
        if: always()
        uses: snyk/actions/golang@9adf32b1121593767fc3c057af55b55db032dc04  # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --json-file-output=snyk-report.json

      - name: Upload Snyk report artifact
        if: always() && hashFiles('snyk-report.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: snyk-report
          path: snyk-report.json
          retention-days: 30

  # Dependency review (for PRs only)
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high
          # Allow permissive licenses commonly used in Go ecosystem
          # LicenseRef-scancode-google-patent-license-golang is Google's Additional IP Rights Grant
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, CC0-1.0, Unlicense, LicenseRef-scancode-google-patent-license-golang
          comment-summary-in-pr: true

  # Trivy vulnerability scanner for dependencies
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@876cf04c63f65e9799bcf1043b584e72469c7143  # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a  # v3.35.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy with JSON output
        uses: aquasecurity/trivy-action@876cf04c63f65e9799bcf1043b584e72469c7143  # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

  # Check for outdated dependencies (scheduled/manual only, not on PRs)
  outdated-check:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.25.9'
          cache: true

      - name: Check for outdated dependencies
        run: |
          echo "=== Checking for outdated dependencies ==="
          go list -u -m -json all | jq -r 'select(.Update != null) | "\(.Path): \(.Version) -> \(.Update.Version)"' > outdated.txt

          if [ -s outdated.txt ]; then
            echo "Outdated dependencies found:"
            cat outdated.txt
          else
            echo "All dependencies are up to date"
          fi

      - name: Upload outdated dependencies list
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: outdated-dependencies
          path: outdated.txt
          retention-days: 7

  # Aggregate results and create summary
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [snyk-scan, trivy-scan]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: reports

      - name: Create security summary
        env:
          SNYK_RESULT: ${{ needs.snyk-scan.result }}
          TRIVY_RESULT: ${{ needs.trivy-scan.result }}
        run: |
          echo "# Dependency Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "$SNYK_RESULT" = "success" ]; then
            echo "| Snyk | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Snyk | Issues Found |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$TRIVY_RESULT" = "success" ]; then
            echo "| Trivy | Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Trivy | Issues Found |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed reports are available in the workflow artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Check if any critical issues found
        env:
          SNYK_RESULT: ${{ needs.snyk-scan.result }}
          TRIVY_RESULT: ${{ needs.trivy-scan.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$SNYK_RESULT" == "failure" ]] || \
             [[ "$TRIVY_RESULT" == "failure" ]]; then
            echo "Critical vulnerabilities detected. Please review the reports."
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              exit 1
            fi
          fi
