name: E2E Tests

on:
  # E2E tests require local infrastructure (Kind cluster, Redis, gateway)
  # not available in GitHub Actions runners. Manual trigger only.
  workflow_dispatch:

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.25.9'
          cache: true

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.9.0
        with:
          cluster_name: netweave-e2e
          wait: 5m

      - name: Verify Kind cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Setup E2E environment
        run: make test-e2e-setup
        timeout-minutes: 15
        env:
          CLUSTER_NAME: netweave-e2e
          NAMESPACE: netweave-e2e
          DOCKER_BUILDKIT: 1

      - name: Wait for gateway to be ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=netweave \
            -n netweave-e2e \
            --timeout=5m

      - name: Run E2E tests
        run: make test-e2e
        env:
          GOFLAGS: -v

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "==> Gateway Logs"
          kubectl logs -n netweave-e2e -l app.kubernetes.io/name=netweave --tail=100 || true

          echo "==> Redis Logs"
          kubectl logs -n netweave-e2e -l app=redis --tail=100 || true

          echo "==> Pod Status"
          kubectl get pods -n netweave-e2e || true

          echo "==> Events"
          kubectl get events -n netweave-e2e --sort-by='.lastTimestamp' || true

      - name: Cleanup E2E environment
        if: always()
        run: make test-e2e-cleanup
