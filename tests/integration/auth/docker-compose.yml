version: '3.8'

services:
  # Keycloak for OAuth2/OIDC authentication
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: dev-mem
      KC_HTTP_PORT: 8080
    command:
      - start-dev
      - --http-port=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - auth-test

  # Vault for certificate management and PKI
  vault:
    image: hashicorp/vault:1.18
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command:
      - server
      - -dev
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - auth-test

  # Redis for session storage (optional, for migration tests)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - auth-test

networks:
  auth-test:
    driver: bridge
