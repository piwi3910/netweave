version: "2"
run:
  build-tags:
    - integration
    - e2e
  modules-download-mode: readonly
  tests: true
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - importas
    - ineffassign
    - interfacebloat
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - predeclared
    - promlinter
    - reassign
    - revive
    - staticcheck
    - testableexamples
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - zerologlint
  settings:
    cyclop:
      max-complexity: 20
      package-average: 20
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*github.com/redis/go-redis/v9.Client).Close
        - (*github.com/gin-gonic/gin.Context).Error
    forbidigo:
      forbid:
        - pattern: ^print.*$
        - pattern: ^fmt\.Print.*$
        - pattern: ^http\.DefaultClient$
          msg: Use custom HTTP client with timeout and configuration
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - whyNoLint
        - unnamedResult
        - rangeValCopy
        - unnecessaryDefer
        - ifElseChain
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
        - G304
        - G402
      severity: medium
      confidence: medium
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: true
    importas:
      alias:
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/client-go/kubernetes
          alias: kubernetes
        - pkg: istio.io/api/networking/v1beta1
          alias: istiov1beta1
        - pkg: github.com/redis/go-redis/v9
          alias: redis
      no-unaliased: true
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
      ignore-rules:
        - oran
        - kubernetes
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: waitgroup-by-value
        - name: unconditional-recursion
        - name: struct-tag
        - name: string-format
        - name: string-of-int
        - name: range-val-in-closure
        - name: range-val-address
        - name: modifies-value-receiver
        - name: modifies-parameter
        - name: early-return
        - name: defer
        - name: constant-logical-expr
        - name: confusing-naming
        - name: confusing-results
        - name: bool-literal-in-expr
        - name: atomic
    wrapcheck:
      ignore-package-globs:
        - github.com/piwi3910/netweave/*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - forbidigo
          - gocognit
          - goconst
          - gocritic
          - gocyclo
          - gosec
          - ireturn
          - maintidx
          - mnd
          - noctx
          - revive
          - testpackage
        path: _test\.go
      # contextcheck: Gin handler signature requires func(*gin.Context), which contextcheck
      # flags as not propagating context. However, handlers immediately extract context via
      # c.Request.Context() and pass it to all functions. All actual context propagation
      # issues in internal/auth/middleware.go were fixed (commits d5c0163, 1a4f595).
      - linters:
          - contextcheck
          - errcheck
          - lll
          - maintidx
        path: tests/integration/
      - linters:
          - contextcheck
          - cyclop
          - goconst
          - gocritic
          - nestif
          - nonamedreturns
        path: cmd/
      - linters:
          - cyclop
        path: cmd/compliance/
      - linters:
          - gosec
        path: _test\.go
        text: 'G404: Use of weak random number generator'
      - linters:
          - govet
        text: 'shadow: declaration of "err"'
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - gosec
        path: cmd/gateway/main\.go
        text: G304
      - linters:
          - ireturn
        path: cmd/gateway/main\.go
        text: InitializeAuth
      - linters:
          - ireturn
        path: internal/adapter/helpers_integration_test\.go
        text: setup.+Adapter returns interface
      - linters:
          - gosec
        path: cmd/compliance/main\.go
        text: G304
      - linters:
          - cyclop
        path: _test\.go
      - linters:
          - cyclop
          - testpackage
        path: tests/(e2e|integration)/.*
      - linters:
          - gosec
        path: cmd/compliance/
        text: G306
      - linters:
          - gosec
        path: internal/smo/adapters/onap/
        text: G402
      - linters:
          - gomoddirectives
        text: replacement are not allowed
      - linters:
          - dupl
        path: tools/compliance/checker\.go
      - linters:
          - lll
        path: tools/compliance/
      - linters:
          - interfacebloat
        path: internal/adapter/
        text: interface has more than.*methods
      - linters:
          - interfacebloat
        path: internal/backend/
        text: interface has more than.*methods
      - linters:
          - ireturn
        path: internal/backend/adapter_(factory|registry)\.go
        text: returns interface
      - linters:
          - revive
        path: internal/adapters/
        text: unused-parameter.*ctx
      - linters:
          - revive
        path: internal/adapters/
        text: stutters.*Adapter
      - linters:
          - nonamedreturns
        path: internal/adapters/
        text: named return.*found
      - linters:
          - nilerr
        path: internal/adapters/
        text: error is not nil.*but it returns nil
      - linters:
          - cyclop
          - dupBranchBody
          - dupl
          - errcheck
          - errorlint
          - gocognit
          - goconst
          - gocritic
          - gocyclo
          - godot
          - govet
          - importas
          - ireturn
          - lll
          - nestif
          - revive
          - staticcheck
          - unconvert
          - unparam
          - wrapcheck
        path: internal/adapters/
      - linters:
          - contextcheck
          - dupl
          - errcheck
          - errorlint
          - gocognit
          - gocritic
          - gocyclo
          - govet
          - importas
          - lll
          - misspell
          - revive
          - unparam
          - wrapcheck
        path: internal/auth/
      - linters:
          - dupl
          - errcheck
          - gocritic
          - godot
          - govet
        path: internal/keycloak/
      - linters:
          - dupl
          - errcheck
          - gocritic
          - govet
        path: internal/vault/
      - linters:
          - gocognit
          - gocritic
          - misspell
        path: internal/workers/
      - linters:
          - misspell
        path: internal/smo/adapters/mock/
      - linters:
          - dupl
        path: internal/smo/adapters/onap/
      - linters:
          - dupl
        path: internal/controllers/
      - linters:
          - dupl
          - lll
        path: internal/dms/
      - linters:
          - lll
        path: internal/events/
      - linters:
          - lll
        path: tests/e2e/
      - linters:
          - gocritic
          - maintidx
          - revive
        path: internal/config/
      - linters:
          - revive
        path: internal/dms/adapters/
        text: stutters.*Adapter
      - linters:
          - interfacebloat
        path: internal/dms/adapter/
        text: interface has more than.*methods
      - linters:
          - contextcheck
          - cyclop
          - forbidigo
          - gocognit
          - goconst
          - gosec
          - revive
          - testpackage
          - unused
        path: internal/smo/adapters/osm/
      - linters:
          - lll
        path: internal/smo/adapters/onap/
      - linters:
          - contextcheck
          - cyclop
          - dupl
          - errcheck
          - exhaustive
          - forbidigo
          - gocognit
          - gocritic
          - gocyclo
          - godot
          - govet
          - importas
          - interfacebloat
          - ireturn
          - lll
          - misspell
          - nestif
          - nilnil
          - noctx
          - nolintlint
          - predeclared
          - promlinter
          - revive
          - thelper
          - unparam
          - unused
          - usestdlibvars
          - wrapcheck
        path: internal/(handlers|middleware|models|observability|registry|routing|server|storage|graphql)
      - linters:
          - cyclop
          - dupl
          - errcheck
          - exhaustive
          - gocognit
          - gocritic
          - gocyclo
          - godot
          - govet
          - interfacebloat
          - ireturn
          - misspell
          - nestif
          - nilnil
          - predeclared
          - revive
          - unparam
          - wrapcheck
        path: internal/dms/
      - linters:
          - cyclop
          - goconst
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
severity:
  default: error
formatters:
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/piwi3910/netweave)
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
