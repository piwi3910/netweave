apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: vault-system
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/component: init
    spec:
      serviceAccountName: vault-init
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-vault
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Vault to be ready..."
              until curl -sf http://vault.vault-system.svc.cluster.local:8200/v1/sys/health > /dev/null 2>&1; do
                echo "Vault not ready, waiting..."
                sleep 5
              done
              echo "Vault is ready!"
      containers:
        - name: vault-init
          image: hashicorp/vault:1.15
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault-system.svc.cluster.local:8200"
          command:
            - sh
            - -c
            - |
              #!/bin/sh
              set -e

              echo "================================"
              echo "Initializing and Unsealing Vault"
              echo "================================"

              # Check if Vault is already initialized
              if vault status 2>&1 | grep -q "Initialized.*true"; then
                echo "Vault is already initialized"
              else
                echo "Initializing Vault..."
                vault operator init \
                  -key-shares=5 \
                  -key-threshold=3 \
                  -format=json > /tmp/vault-init.json

                # Extract unseal keys and root token
                cat /tmp/vault-init.json | jq -r '.unseal_keys_b64[]' > /tmp/unseal-keys.txt
                cat /tmp/vault-init.json | jq -r '.root_token' > /tmp/root-token.txt

                # Create Kubernetes secret with unseal keys and root token
                kubectl create secret generic vault-unseal-keys \
                  --from-file=unseal-keys=/tmp/unseal-keys.txt \
                  --from-file=root-token=/tmp/root-token.txt \
                  --namespace=vault-system \
                  --dry-run=client -o yaml | kubectl apply -f -

                echo "Vault initialized successfully"
              fi

              # Unseal all Vault pods
              echo "Unsealing Vault pods..."
              UNSEAL_KEYS=$(kubectl get secret vault-unseal-keys -n vault-system -o jsonpath='{.data.unseal-keys}' | base64 -d)

              for pod in vault-0 vault-1 vault-2; do
                echo "Unsealing $pod..."

                # Wait for pod to be running
                kubectl wait --for=condition=ready pod/$pod -n vault-system --timeout=60s || true

                # Unseal the pod (requires 3 keys)
                echo "$UNSEAL_KEYS" | head -n 3 | while read key; do
                  kubectl exec -n vault-system $pod -- vault operator unseal $key || true
                done
              done

              echo "================================"
              echo "Setting up PKI"
              echo "================================"

              # Get root token
              export VAULT_TOKEN=$(kubectl get secret vault-unseal-keys -n vault-system -o jsonpath='{.data.root-token}' | base64 -d)

              # Wait for Vault leader election
              sleep 10

              # Run PKI setup script
              /vault/scripts/init-pki.sh

              echo "Vault PKI setup complete!"
          volumeMounts:
            - name: init-script
              mountPath: /vault/scripts
      volumes:
        - name: init-script
          configMap:
            name: vault-init-script
            defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-init-script
  namespace: vault-system
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: init
data:
  init-pki.sh: |
    #!/bin/sh
    set -e

    echo "Setting up Vault PKI for NetWeave Gateway"

    # Enable PKI secrets engine for root CA
    echo "1. Enabling PKI secrets engine at pki/..."
    vault secrets enable -path=pki pki || echo "PKI already enabled at pki/"

    # Tune max lease TTL to 10 years for root CA
    echo "2. Configuring PKI max lease TTL to 10 years..."
    vault secrets tune -max-lease-ttl=87600h pki

    # Generate root CA certificate (only if not exists)
    echo "3. Generating root CA certificate..."
    if ! vault read pki/cert/ca > /dev/null 2>&1; then
      vault write -field=certificate pki/root/generate/internal \
        common_name="NetWeave Root CA" \
        issuer_name="netweave-root" \
        ttl=87600h > /tmp/root_ca.crt
      echo "   Root CA certificate generated"
    else
      echo "   Root CA already exists"
    fi

    # Configure CA and CRL URLs
    echo "4. Configuring CA and CRL URLs..."
    vault write pki/config/urls \
      issuing_certificates="http://vault.vault-system.svc.cluster.local:8200/v1/pki/ca" \
      crl_distribution_points="http://vault.vault-system.svc.cluster.local:8200/v1/pki/crl"

    # Enable PKI secrets engine for intermediate CA
    echo "5. Enabling PKI secrets engine at pki_int/..."
    vault secrets enable -path=pki_int pki || echo "PKI already enabled at pki_int/"

    # Tune max lease TTL to 5 years for intermediate CA
    echo "6. Configuring intermediate PKI max lease TTL to 5 years..."
    vault secrets tune -max-lease-ttl=43800h pki_int

    # Generate intermediate CA (only if not exists)
    if ! vault read pki_int/cert/ca > /dev/null 2>&1; then
      echo "7. Generating intermediate CA CSR..."
      vault write -format=json pki_int/intermediate/generate/internal \
        common_name="NetWeave Intermediate CA" \
        issuer_name="netweave-intermediate" \
        | jq -r '.data.csr' > /tmp/pki_intermediate.csr

      echo "8. Signing intermediate CA with root CA..."
      vault write -format=json pki/root/sign-intermediate \
        issuer_ref="netweave-root" \
        csr=@/tmp/pki_intermediate.csr \
        format=pem_bundle \
        ttl=43800h \
        | jq -r '.data.certificate' > /tmp/intermediate.cert.pem

      echo "9. Importing signed intermediate certificate..."
      vault write pki_int/intermediate/set-signed \
        certificate=@/tmp/intermediate.cert.pem
      echo "   Intermediate CA configured"
    else
      echo "   Intermediate CA already exists"
    fi

    # Configure intermediate CA URLs
    echo "10. Configuring intermediate CA and CRL URLs..."
    vault write pki_int/config/urls \
      issuing_certificates="http://vault.vault-system.svc.cluster.local:8200/v1/pki_int/ca" \
      crl_distribution_points="http://vault.vault-system.svc.cluster.local:8200/v1/pki_int/crl"

    # Create role for NetWeave client certificates
    echo "11. Creating netweave-client role..."
    vault write pki_int/roles/netweave-client \
      issuer_ref="netweave-intermediate" \
      allowed_domains="netweave.local,*.netweave.local,localhost" \
      allow_subdomains=true \
      allow_bare_domains=true \
      allow_localhost=true \
      allow_ip_sans=true \
      max_ttl=8760h \
      key_type=rsa \
      key_bits=2048 \
      require_cn=true

    # Create role for NetWeave server certificates
    echo "12. Creating netweave-server role..."
    vault write pki_int/roles/netweave-server \
      issuer_ref="netweave-intermediate" \
      allowed_domains="netweave.local,*.netweave.local,localhost,*.svc.cluster.local" \
      allow_subdomains=true \
      allow_bare_domains=true \
      allow_localhost=true \
      allow_ip_sans=true \
      server_flag=true \
      client_flag=false \
      max_ttl=8760h \
      key_type=rsa \
      key_bits=2048

    # Create policy for gateway
    echo "13. Creating vault policy for gateway..."
    vault policy write gateway - <<EOF
    # Read CA certificate
    path "pki_int/cert/ca" {
      capabilities = ["read"]
    }

    # Read CA certificate chain
    path "pki_int/ca_chain" {
      capabilities = ["read"]
    }

    # Issue client certificates
    path "pki_int/issue/netweave-client" {
      capabilities = ["create", "update"]
    }

    # Issue server certificates
    path "pki_int/issue/netweave-server" {
      capabilities = ["create", "update"]
    }

    # Revoke certificates
    path "pki_int/revoke" {
      capabilities = ["create", "update"]
    }

    # Read CRL
    path "pki_int/crl" {
      capabilities = ["read"]
    }

    # List certificates
    path "pki_int/certs" {
      capabilities = ["list"]
    }

    # Read certificate details
    path "pki_int/cert/*" {
      capabilities = ["read"]
    }
    EOF

    # Create policy for Keycloak
    echo "14. Creating vault policy for Keycloak..."
    vault policy write keycloak - <<EOF
    # Issue client certificates
    path "pki_int/issue/netweave-client" {
      capabilities = ["create", "update"]
    }

    # Read CA certificate
    path "pki_int/cert/ca" {
      capabilities = ["read"]
    }
    EOF

    # Enable Kubernetes auth method
    echo "15. Enabling Kubernetes auth method..."
    vault auth enable kubernetes || echo "Kubernetes auth already enabled"

    # Configure Kubernetes auth
    echo "16. Configuring Kubernetes auth..."
    vault write auth/kubernetes/config \
      kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443"

    # Create role for gateway service account
    echo "17. Creating Kubernetes auth role for gateway..."
    vault write auth/kubernetes/role/gateway \
      bound_service_account_names=o2ims-gateway \
      bound_service_account_namespaces=default,o2ims-system \
      policies=gateway \
      ttl=24h

    # Create role for Keycloak service account
    echo "18. Creating Kubernetes auth role for Keycloak..."
    vault write auth/kubernetes/role/keycloak \
      bound_service_account_names=keycloak \
      bound_service_account_namespaces=keycloak-system \
      policies=keycloak \
      ttl=24h

    echo "Vault PKI setup complete!"
