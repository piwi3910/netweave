apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vault-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - storageclass.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - networkpolicy.yaml
  - init-job.yaml

labels:
  - pairs:
      app.kubernetes.io/name: vault
      app.kubernetes.io/managed-by: kustomize
