apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-network-policy
  namespace: vault-system
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/component: security
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from init job
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              app.kubernetes.io/component: init
      ports:
        - protocol: TCP
          port: 8200
    # Allow from gateway namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 8200
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: o2ims-system
      ports:
        - protocol: TCP
          port: 8200
    # Allow from keycloak namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak-system
      ports:
        - protocol: TCP
          port: 8200
    # Allow Vault pods to communicate with each other (Raft cluster)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              app.kubernetes.io/component: security
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
  egress:
    # ========================================================================
    # DNS Resolution - Required for all Kubernetes DNS lookups
    # ========================================================================
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53  # Needed for responses >512 bytes (EDNS0/truncation fallback)

    # ========================================================================
    # Vault Raft Cluster Communication - Required for HA Vault cluster
    # ========================================================================
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              app.kubernetes.io/component: security
      ports:
        - protocol: TCP
          port: 8200  # Vault API
        - protocol: TCP
          port: 8201  # Vault cluster port

    # ========================================================================
    # Kubernetes API Server Access - Required for Kubernetes auth method
    # ========================================================================
    # Vault needs to communicate with the Kubernetes API server to:
    # 1. Validate service account tokens (Kubernetes auth method)
    # 2. Verify pod/namespace metadata for authentication
    #
    # CLUSTER-SPECIFIC CONFIGURATION:
    #
    # Option A: Self-hosted Kubernetes (kubeadm, on-prem)
    #   API server pods run in kube-system namespace with standard labels.
    #
    # Option B: Managed Kubernetes (EKS, GKE, AKS)
    #   API server runs outside cluster (managed control plane).
    #   Use ipBlock with API server endpoint CIDR instead.
    #   Get CIDR: kubectl get endpoints kubernetes -o jsonpath='{.subsets[].addresses[].ip}'
    #
    # CURRENT: Option A (self-hosted). For managed K8s, uncomment Option B below.
    # ========================================================================

    # Rule 1: Self-hosted Kubernetes - kubeadm standard label
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - protocol: TCP
          port: 443

    # Rule 2: Self-hosted Kubernetes - control-plane tier label (alternative selector)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              tier: control-plane
      ports:
        - protocol: TCP
          port: 443

    # Rule 3: Managed Kubernetes - IP-based access (OPTIONAL)
    # Uncomment and set CIDR for your managed K8s API server.
    # Find IP: kubectl get endpoints kubernetes -n default -o jsonpath='{.subsets[].addresses[].ip}'
    #
    # Examples:
    #   EKS: 10.0.0.1/32 (from `aws eks describe-cluster --query cluster.endpoint`)
    #   GKE: 10.0.0.1/32 (from `gcloud container clusters describe --format='get(endpoint)'`)
    #   AKS: 10.0.0.1/32 (from `az aks show --query fqdn`)
    #
    # - to:
    #     - ipBlock:
    #         cidr: 10.0.0.1/32  # REPLACE with your API server IP/CIDR
    #   ports:
    #     - protocol: TCP
    #       port: 443
