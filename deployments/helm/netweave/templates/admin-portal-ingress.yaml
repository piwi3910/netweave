{{- if .Values.adminPortal.enabled }}
{{- if .Values.adminPortal.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "netweave.fullname" . }}-admin-portal
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-portal
  {{- with .Values.adminPortal.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.adminPortal.ingress.className }}
  ingressClassName: {{ .Values.adminPortal.ingress.className }}
  {{- end }}
  {{- if .Values.adminPortal.ingress.tls }}
  tls:
    {{- range .Values.adminPortal.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.adminPortal.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "netweave.fullname" $ }}-admin-portal
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
