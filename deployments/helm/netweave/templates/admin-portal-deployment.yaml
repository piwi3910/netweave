{{- if .Values.adminPortal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netweave.fullname" . }}-admin-portal
  labels:
    app.kubernetes.io/name: {{ include "netweave.name" . }}-admin-portal
    app.kubernetes.io/component: admin-portal
    {{- include "netweave.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.adminPortal.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "netweave.name" . }}-admin-portal
      app.kubernetes.io/component: admin-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "netweave.name" . }}-admin-portal
        app.kubernetes.io/component: admin-portal
    spec:
      {{- with .Values.adminPortal.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin-portal
          image: "{{ .Values.adminPortal.image.repository }}:{{ .Values.adminPortal.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.adminPortal.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: AUTH_KEYCLOAK_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "netweave.fullname" . }}-admin-portal
                  key: keycloak-client-id
            - name: AUTH_KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "netweave.fullname" . }}-admin-portal
                  key: keycloak-client-secret
            - name: AUTH_KEYCLOAK_ISSUER
              value: {{ .Values.adminPortal.keycloak.issuer | quote }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "netweave.fullname" . }}-admin-portal
                  key: auth-secret
            - name: AUTH_URL
              value: {{ .Values.adminPortal.authUrl | quote }}
            - name: NEXT_PUBLIC_API_BASE_URL
              value: {{ .Values.adminPortal.apiBaseUrl | quote }}
            {{- if .Values.adminPortal.trustCA }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/netweave/tls/ca.crt
            {{- end }}
          {{- if .Values.adminPortal.trustCA }}
          volumeMounts:
            - name: ca-cert
              mountPath: /etc/netweave/tls
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml (.Values.adminPortal.resources | default (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "cpu" "500m" "memory" "256Mi"))) | nindent 12 }}
      {{- if .Values.adminPortal.trustCA }}
      volumes:
        - name: ca-cert
          configMap:
            name: {{ .Values.adminPortal.trustCA }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netweave.fullname" . }}-admin-portal
  labels:
    app.kubernetes.io/name: {{ include "netweave.name" . }}-admin-portal
    app.kubernetes.io/component: admin-portal
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "netweave.name" . }}-admin-portal
    app.kubernetes.io/component: admin-portal
{{- end }}
