{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netweave.fullname" . }}-config
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    log_level: {{ .Values.gateway.config.logLevel | quote }}

    server:
      address: {{ .Values.gateway.config.server.address | quote }}
      read_timeout: {{ .Values.gateway.config.server.readTimeout | quote }}
      write_timeout: {{ .Values.gateway.config.server.writeTimeout | quote }}
      idle_timeout: {{ .Values.gateway.config.server.idleTimeout | quote }}

    # Multi-tenancy and RBAC (master switch for auth enforcement)
    multi_tenancy:
      enabled: {{ .Values.gateway.config.multiTenancy.enabled }}
      require_mtls: {{ .Values.gateway.config.multiTenancy.requireMTLS }}
      initialize_default_roles: {{ .Values.gateway.config.multiTenancy.initializeDefaultRoles }}
      audit_log_retention_days: {{ .Values.gateway.config.multiTenancy.auditLogRetentionDays }}
      skip_auth_paths:
        {{- toYaml .Values.gateway.config.multiTenancy.skipAuthPaths | nindent 8 }}

    # Auth store backend (keycloak or redis)
    auth:
      backend: {{ .Values.gateway.config.auth.backend | quote }}
      {{- if eq .Values.gateway.config.auth.backend "keycloak" }}
      keycloak:
        base_url: {{ include "netweave.keycloakURL" . | quote }}
        realm: {{ .Values.gateway.config.auth.keycloak.realm | quote }}
        client_id: {{ .Values.gateway.config.auth.keycloak.clientID | quote }}
        client_secret_env_var: {{ .Values.gateway.config.auth.keycloak.clientSecretEnvVar | quote }}
        admin_username: {{ .Values.gateway.config.auth.keycloak.adminUsername | quote }}
        admin_password_env_var: {{ .Values.gateway.config.auth.keycloak.adminPasswordEnvVar | quote }}
        timeout: {{ .Values.gateway.config.auth.keycloak.timeout | quote }}
      {{- end }}

    # OAuth2/OIDC token validation
    oauth2:
      enabled: {{ .Values.gateway.config.oauth2.enabled }}
      {{- if .Values.gateway.config.oauth2.enabled }}
      priority: {{ .Values.gateway.config.oauth2.priority | default false }}
      keycloak_base_url: {{ include "netweave.keycloakURL" . | quote }}
      keycloak_realm: {{ .Values.gateway.config.oauth2.keycloakRealm | default "netweave" | quote }}
      keycloak_client_id: {{ .Values.gateway.config.oauth2.keycloakClientID | default "netweave-gateway" | quote }}
      keycloak_secret_env_var: {{ .Values.gateway.config.oauth2.keycloakSecretEnvVar | default "KEYCLOAK_CLIENT_SECRET" | quote }}
      auto_provision_users: {{ .Values.gateway.config.oauth2.autoProvisionUsers | default false }}
      default_role: {{ .Values.gateway.config.oauth2.defaultRole | default "tenant-admin" | quote }}
      require_tenant_claim: {{ .Values.gateway.config.oauth2.requireTenantClaim | default true }}
      {{- end }}

    cert_manager:
      enabled: {{ .Values.gateway.config.certManager.enabled }}
      monitor_interval: {{ .Values.gateway.config.certManager.monitorInterval | quote }}
      renewal_window: {{ .Values.gateway.config.certManager.renewalWindow | quote }}
      max_retries: {{ .Values.gateway.config.certManager.maxRetries }}
      retry_interval: {{ .Values.gateway.config.certManager.retryInterval | quote }}

    vault:
      {{- if .Values.vault.enabled }}
      enabled: true
      address: {{ include "netweave.vaultURL" . | quote }}
      {{- else }}
      enabled: false
      {{- end }}

    redis:
      enabled: {{ .Values.redis.enabled }}
      {{- if .Values.redis.enabled }}
      mode: "standalone"
      addresses:
        - "{{ include "netweave.redis.host" . }}:{{ include "netweave.redis.port" . }}"
      db: 0
      password_env_var: "REDIS_PASSWORD"
      {{- end }}
{{- end }}
