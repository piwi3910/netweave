{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netweave.fullname" . }}-postgresql
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
  {{- if .Values.postgresql.gateway }}
  GATEWAY_DB_PASSWORD: {{ .Values.postgresql.gateway.password | default .Values.postgresql.auth.password | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netweave.fullname" . }}-postgresql-init
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  init-netweave-db.sh: |
    #!/bin/bash
    set -e
    {{- if .Values.postgresql.gateway }}
    GATEWAY_DB="{{ .Values.postgresql.gateway.database | default "netweave" }}"
    GATEWAY_USER="{{ .Values.postgresql.gateway.username | default "netweave" }}"
    GATEWAY_PASS="${GATEWAY_DB_PASSWORD:-$POSTGRES_PASSWORD}"

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE $GATEWAY_DB' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$GATEWAY_DB')\gexec
        DO \$\$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$GATEWAY_USER') THEN
                CREATE ROLE $GATEWAY_USER WITH LOGIN PASSWORD '$GATEWAY_PASS';
            END IF;
        END
        \$\$;
        GRANT ALL PRIVILEGES ON DATABASE $GATEWAY_DB TO $GATEWAY_USER;
        \c $GATEWAY_DB
        GRANT ALL ON SCHEMA public TO $GATEWAY_USER;
    EOSQL
    echo "Gateway database '$GATEWAY_DB' and user '$GATEWAY_USER' initialized."
    {{- else }}
    echo "No gateway database configuration found, skipping."
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "netweave.fullname" . }}-postgresql
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "netweave.fullname" . }}-postgresql
  replicas: {{ .Values.postgresql.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "netweave.name" . }}-postgresql
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "netweave.name" . }}-postgresql
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "netweave.fullname" . }}-postgresql
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: {{ include "netweave.fullname" . }}-postgresql-init
            defaultMode: 0755
      {{- else }}
      volumes:
        - name: init-scripts
          configMap:
            name: {{ include "netweave.fullname" . }}-postgresql-init
            defaultMode: 0755
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netweave.fullname" . }}-postgresql
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: tcp-postgresql
      name: tcp-postgresql
  selector:
    app.kubernetes.io/name: {{ include "netweave.name" . }}-postgresql
    app.kubernetes.io/component: postgresql
{{- end }}
