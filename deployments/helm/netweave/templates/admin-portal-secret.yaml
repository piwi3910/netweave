{{- if .Values.adminPortal.enabled }}
{{- if .Values.secrets.create }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-admin-portal" (include "netweave.fullname" .))) }}
{{- $clientSecret := "" }}
{{- $authSecret := "" }}
{{- if $existingSecret }}
  {{- $clientSecret = index $existingSecret.data "keycloak-client-secret" | b64dec }}
  {{- $authSecret = index $existingSecret.data "auth-secret" | b64dec }}
{{- else }}
  {{- $clientSecret = .Values.adminPortal.auth.clientSecret | default (randAlphaNum 32) }}
  {{- $authSecret = .Values.adminPortal.auth.authSecret | default (randAlphaNum 64) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netweave.fullname" . }}-admin-portal
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-portal
type: Opaque
stringData:
  keycloak-client-id: {{ .Values.adminPortal.auth.clientId | quote }}
  keycloak-client-secret: {{ $clientSecret | quote }}
  auth-secret: {{ $authSecret | quote }}
{{- end }}
{{- end }}
