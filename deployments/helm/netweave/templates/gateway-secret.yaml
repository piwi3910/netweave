{{- if .Values.gateway.enabled }}
{{- if .Values.secrets.create }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "netweave.fullname" .))) }}
{{- $dbPassword := "" }}
{{- $keycloakClientSecret := "" }}
{{- if $existingSecret }}
  {{- $dbPassword = index $existingSecret.data "database-connection-string" | b64dec | regexFind "password=([^ ]+)" | regexFind "[^=]+$" }}
  {{- $keycloakClientSecret = index $existingSecret.data "keycloak-client-secret" | b64dec }}
{{- else }}
  {{- $dbPassword = .Values.postgresql.auth.password | default (randAlphaNum 32) }}
  {{- $keycloakClientSecret = .Values.gateway.config.auth.oauth2.clientSecret | default (randAlphaNum 32) }}
{{- end }}
{{- $sslMode := "require" }}
{{- if .Values.postgresql.enabled }}
  {{- if .Values.postgresql.primary.tls.enabled }}
    {{- $sslMode = "require" }}
  {{- else }}
    {{- $sslMode = .Values.postgresql.primary.tls.sslMode | default "disable" }}
  {{- end }}
{{- else }}
  {{- $sslMode = .Values.keycloak.externalDatabase.sslMode | default "require" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netweave.fullname" . }}-secret
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  database-connection-string: |-
    host={{ include "netweave.postgresql.host" . }} \
    port={{ include "netweave.postgresql.port" . }} \
    user={{ include "netweave.postgresql.username" . }} \
    password={{ $dbPassword }} \
    dbname={{ include "netweave.postgresql.database" . }} \
    sslmode={{ $sslMode }}
  keycloak-client-secret: {{ $keycloakClientSecret | quote }}
  {{- if .Values.vault.enabled }}
  vault-token: {{ .Values.vault.token | default "" | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  {{- if .Values.redis.auth.enabled }}
  {{- $redisPassword := "" }}
  {{- if $existingSecret }}
    {{- $redisPassword = index $existingSecret.data "redis-password" | b64dec }}
  {{- else }}
    {{- $redisPassword = .Values.redis.auth.password | default (randAlphaNum 32) }}
  {{- end }}
  redis-password: {{ $redisPassword | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
