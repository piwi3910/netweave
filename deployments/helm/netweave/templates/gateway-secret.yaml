{{- if .Values.gateway.enabled }}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netweave.fullname" . }}-secret
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  database-connection-string: |-
    host={{ include "netweave.postgresql.host" . }} \
    port={{ include "netweave.postgresql.port" . }} \
    user={{ include "netweave.postgresql.username" . }} \
    password={{ .Values.postgresql.auth.password | default (randAlphaNum 32) }} \
    dbname={{ include "netweave.postgresql.database" . }} \
    sslmode=require
  keycloak-client-secret: {{ .Values.gateway.config.auth.oauth2.clientSecret | default (randAlphaNum 32) | quote }}
  {{- if .Values.vault.enabled }}
  vault-token: {{ .Values.vault.token | default "" | quote }}
  {{- end }}
{{- end }}
{{- end }}
