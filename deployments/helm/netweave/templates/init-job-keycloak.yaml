{{- if .Values.initJobs.keycloakRealm.enabled }}
{{- if .Values.keycloak.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "netweave.fullname" . }}-keycloak-init
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.initJobs.keycloakRealm.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.initJobs.keycloakRealm.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "netweave.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "netweave.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: keycloak-init
          image: curlimages/curl:8.5.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for Keycloak to be ready..."
              until curl -sf {{ include "netweave.keycloakURL" . }}/health/ready > /dev/null 2>&1; do
                echo "Keycloak not ready, waiting..."
                sleep 5
              done
              echo "Keycloak is ready!"

              # The realm import is handled by Keycloak's --import-realm flag
              # via the extraEnvVars and volume mount configuration
              # This job primarily waits for readiness

              echo "Keycloak realm initialization complete"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
