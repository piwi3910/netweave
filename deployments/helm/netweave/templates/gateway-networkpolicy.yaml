{{- if .Values.gateway.enabled }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "netweave.fullname" . }}-gateway
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      {{- include "netweave.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  ingress:
    # Allow ingress from ingress controller on all gateway ports
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port }}
        - protocol: TCP
          port: {{ .Values.gateway.service.o2Port }}
        - protocol: TCP
          port: {{ .Values.gateway.service.tmfPort }}
        - protocol: TCP
          port: {{ .Values.gateway.service.graphqlPort }}
    # Allow ingress from within namespace (for testing/debugging)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port }}
        - protocol: TCP
          port: {{ .Values.gateway.service.o2Port }}
        - protocol: TCP
          port: {{ .Values.gateway.service.tmfPort }}
        - protocol: TCP
          port: {{ .Values.gateway.service.graphqlPort }}
        - protocol: TCP
          port: 9090  # Metrics port
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow access to PostgreSQL
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    # Allow access to Redis
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    # Allow access to Keycloak
    {{- if .Values.keycloak.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    {{- end }}
    # Allow access to Vault
    {{- if .Values.vault.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.vault.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    {{- end }}
    # Allow access to Kubernetes API server (for service discovery)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
