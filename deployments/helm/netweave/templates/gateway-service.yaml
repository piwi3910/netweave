{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netweave.fullname" . }}
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: admin
      protocol: TCP
      name: admin
    - port: {{ .Values.gateway.service.o2Port }}
      targetPort: o2
      protocol: TCP
      name: o2
    - port: {{ .Values.gateway.service.tmfPort }}
      targetPort: tmf
      protocol: TCP
      name: tmf
    - port: {{ .Values.gateway.service.graphqlPort }}
      targetPort: graphql
      protocol: TCP
      name: graphql
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "netweave.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- end }}
