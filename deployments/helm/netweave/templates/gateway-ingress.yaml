{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.ingress.admin.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "netweave.fullname" . }}-admin
  labels:
    {{- include "netweave.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.ingress.admin.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.gateway.ingress.admin.className }}
  ingressClassName: {{ .Values.gateway.ingress.admin.className }}
  {{- end }}
  {{- if .Values.gateway.ingress.admin.tls }}
  tls:
    {{- range .Values.gateway.ingress.admin.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.gateway.ingress.admin.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "netweave.fullname" $ }}
                port:
                  name: admin
          {{- end }}
    {{- end }}
{{- end }}
