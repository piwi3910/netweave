# Default values for netweave.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Global image registry (can be overridden per component)
  imageRegistry: ""
  # Global image pull secrets
  imagePullSecrets: []
  # Global storage class
  storageClass: ""

# O2-IMS Gateway configuration
gateway:
  enabled: true
  replicaCount: 3

  image:
    registry: ghcr.io
    repository: piwi3910/netweave
    tag: ""  # Defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: netweave.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: netweave-tls
    #    hosts:
    #      - netweave.local

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - netweave
            topologyKey: kubernetes.io/hostname

  # Gateway configuration
  config:
    # Log level: debug, info, warn, error
    logLevel: info

    # Server configuration
    server:
      address: ":8080"
      readTimeout: 30s
      writeTimeout: 30s
      idleTimeout: 120s

    # Database configuration
    database:
      connectionString: ""  # Set via secret or override

    # Authentication configuration
    auth:
      # Enable OAuth2/OIDC authentication
      oauth2:
        enabled: true
        issuerURL: ""  # Will be set to Keycloak URL
        clientID: netweave-gateway
        clientSecret: ""  # Set via secret

      # Enable mTLS authentication
      mtls:
        enabled: true
        caCert: ""  # Will be fetched from Vault

    # Certificate manager configuration
    certManager:
      enabled: true
      monitorInterval: 1h
      renewalWindow: 720h  # 30 days
      maxRetries: 3
      retryInterval: 1h

# PostgreSQL configuration (for Keycloak)
postgresql:
  enabled: true
  auth:
    username: keycloak
    password: ""  # Set via secret, generated if empty
    database: keycloak
  primary:
    persistence:
      enabled: true
      size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# Keycloak configuration
keycloak:
  enabled: true
  replicaCount: 2

  auth:
    adminUser: admin
    adminPassword: ""  # Set via secret, generated if empty

  # Use the main PostgreSQL instance deployed by this chart
  postgresql:
    enabled: false  # Don't deploy another PostgreSQL
  externalDatabase:
    host: netweave-postgresql  # Main PostgreSQL service (update via --set for custom release names)
    port: 5432
    user: keycloak
    database: keycloak
    password: ""  # Must match postgresql.auth.password

  ingress:
    enabled: false
    ingressClassName: nginx
    hostname: keycloak.local
    annotations: {}
    tls: false

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

  # Keycloak realm import
  extraVolumes:
    - name: realm-import
      configMap:
        name: keycloak-realm-import

  extraVolumeMounts:
    - name: realm-import
      mountPath: /opt/keycloak/data/import

  extraEnvVars:
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_METRICS_ENABLED
      value: "true"
    - name: KEYCLOAK_EXTRA_ARGS
      value: "--import-realm"

# Vault configuration
vault:
  enabled: true
  replicaCount: 3

  # We'll deploy Vault using our custom manifests
  # This is a placeholder for future Vault Helm chart integration
  deployViaManifests: true
  namespace: vault-system

# Redis configuration (keeping for gradual migration)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: ""  # Set via secret, generated if empty
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

# Init jobs configuration
initJobs:
  # Keycloak realm initialization
  keycloakRealm:
    enabled: true
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400  # 24 hours

  # Vault PKI initialization
  vaultPKI:
    enabled: true
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400  # 24 hours

# Monitoring configuration
monitoring:
  enabled: false

  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

  prometheusRule:
    enabled: false

# Secrets configuration
secrets:
  # Create secrets from values (not recommended for production)
  create: true

  # Use external secrets operator
  externalSecrets:
    enabled: false
    backend: vault
    vaultRole: netweave

# Network policies
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
