# Default values for netweave.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Global image registry (can be overridden per component)
  imageRegistry: ""
  # Global image pull secrets
  imagePullSecrets: []
  # Global storage class
  storageClass: ""

# O2-IMS Gateway configuration
gateway:
  enabled: true
  replicaCount: 3

  image:
    registry: ghcr.io
    repository: piwi3910/netweave
    tag: ""  # Defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: netweave.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Additional redirect URIs and web origins for the netweave-gateway Keycloak client.
  # Used to add ingress hostnames alongside the default localhost entries.
  keycloakClient:
    additionalRedirectUris: []
    additionalWebOrigins: []

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - netweave
            topologyKey: kubernetes.io/hostname

  # Init container configuration
  initContainers:
    waitForKeycloak:
      image:
        registry: docker.io
        repository: curlimages/curl
        tag: "8.5.0"
    waitForVault:
      image:
        registry: docker.io
        repository: curlimages/curl
        tag: "8.5.0"

  # Gateway configuration
  config:
    # Log level: debug, info, warn, error
    logLevel: info

    # Server configuration
    server:
      address: ":8080"
      readTimeout: 30s
      writeTimeout: 30s
      idleTimeout: 120s

    # PostgreSQL storage configuration (for subscriptions, auth, backends)
    postgres:
      host: ""  # Auto-resolved from Helm if empty
      port: 5432
      database: netweave
      user: netweave
      passwordEnvVar: POSTGRES_PASSWORD
      sslMode: prefer
      maxConns: 25
      minConns: 5

    # Storage mode: "redis" (legacy), "postgres" (recommended), "dual" (migration)
    storageMode: postgres

    # Multi-tenancy and RBAC configuration (maps to multi_tenancy.* in Go config)
    multiTenancy:
      enabled: true
      requireMTLS: true
      initializeDefaultRoles: true
      auditLogRetentionDays: 30
      skipAuthPaths:
        - /healthz
        - /readyz

    # Auth store backend configuration (maps to auth.* in Go config)
    auth:
      backend: keycloak  # "keycloak" or "redis"
      keycloak:
        realm: netweave
        clientID: netweave-gateway
        clientSecretEnvVar: KEYCLOAK_CLIENT_SECRET
        adminUsername: admin
        adminPasswordEnvVar: KEYCLOAK_ADMIN_PASSWORD
        timeout: 30s

    # OAuth2/OIDC token validation configuration (maps to oauth2.* in Go config)
    # Disabled by default - mTLS is the primary authentication mechanism.
    # Enable if OAuth2 Bearer tokens are needed alongside or instead of mTLS.
    oauth2:
      enabled: false
      priority: false
      keycloakRealm: netweave
      keycloakClientID: netweave-gateway
      keycloakSecretEnvVar: KEYCLOAK_CLIENT_SECRET
      autoProvisionUsers: false
      defaultRole: tenant-admin
      requireTenantClaim: true

    # TLS configuration for mTLS (maps to tls.* in Go config)
    tls:
      enabled: false
      # Path inside container where cert/key/ca are mounted
      certFile: /etc/netweave/tls/tls.crt
      keyFile: /etc/netweave/tls/tls.key
      caFile: /etc/netweave/tls/ca.crt
      clientAuth: "require-and-verify"
      minVersion: "1.3"
      # Name of existing K8s TLS secret (type: kubernetes.io/tls)
      existingServerSecret: ""
      # Name of existing K8s ConfigMap with ca.crt key
      existingCAConfigMap: ""

    # Certificate manager configuration
    certManager:
      enabled: true
      monitorInterval: 1h
      renewalWindow: 720h  # 30 days
      maxRetries: 3
      retryInterval: 1h

# Admin Portal configuration
adminPortal:
  enabled: true
  replicas: 2

  image:
    repository: ghcr.io/piwi3910/netweave-admin-portal
    tag: ""  # Defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  keycloak:
    issuer: ""  # Will be set to Keycloak issuer URL
    # Additional redirect URIs and web origins for the admin-portal Keycloak client.
    # Used to add ingress hostnames alongside the default localhost entries.
    additionalRedirectUris: []
    additionalWebOrigins: []

  authUrl: ""  # External URL for next-auth

  auth:
    clientId: admin-portal
    clientSecret: ""  # Set via secret
    authSecret: ""  # NextAuth secret, generated if empty

  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: admin.netweave.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # hostAliases injects entries into the pod's /etc/hosts.
  # Used to resolve ingress hostnames from inside the pod (e.g., for OIDC discovery).
  hostAliases: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# PostgreSQL configuration (official postgres image)
postgresql:
  enabled: true
  replicas: 1

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    username: keycloak
    password: ""  # Set via secret, generated if empty
    database: keycloak

  # Gateway database (created alongside keycloak DB on the same PG instance)
  gateway:
    database: netweave
    username: netweave
    password: ""  # Set via secret, uses postgresql.auth.password if empty

  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# Keycloak configuration (official quay.io/keycloak/keycloak image)
keycloak:
  enabled: true
  replicaCount: 2

  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0"
    pullPolicy: IfNotPresent

  # Init container to wait for PostgreSQL
  initImage:
    repository: busybox
    tag: "1.37"

  # Use start-dev for development, start for production
  devMode: false

  # Proxy headers mode (e.g., "forwarded" or "xforwarded")
  proxy: ""

  ingress:
    enabled: false
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    hosts:
      - host: auth.netweave.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  auth:
    adminUser: admin
    adminPassword: ""  # Set via secret, generated if empty

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

# Vault configuration
vault:
  enabled: true
  replicaCount: 3
  deployViaManifests: true
  namespace: vault-system
  skipTLSVerify: true  # Set to false in production
  caCert: false
  caCertSecret: "vault-tls"

# Redis configuration (official redis image)
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  auth:
    enabled: true
    password: ""  # Set via secret, generated if empty

  persistence:
    enabled: true
    size: 8Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Init jobs configuration
initJobs:
  # Keycloak realm initialization
  keycloakRealm:
    enabled: true
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400
    image:
      registry: docker.io
      repository: curlimages/curl
      tag: "8.5.0"

  # Keycloak client secret configuration
  keycloakConfig:
    enabled: true
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400
    image:
      registry: docker.io
      repository: curlimages/curl
      tag: "8.5.0"

  # Vault PKI initialization
  vaultPKI:
    enabled: true
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400
    image:
      registry: docker.io
      repository: hashicorp/vault
      tag: "1.15.4"

# Monitoring configuration
monitoring:
  enabled: false

  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []

  prometheusRule:
    enabled: false
    additionalLabels: {}

# Secrets configuration
secrets:
  create: true

  externalSecrets:
    enabled: false
    backend: vault
    vaultRole: netweave

# Network policies
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
