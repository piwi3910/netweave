# values-local.yaml - Docker Desktop Kubernetes development overrides
# Usage:
#   1. Setup Vault:   netweave-cli setup vault
#   2. Install NGINX: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/cloud/deploy.yaml
#                     Then enable ssl-passthrough:
#                     kubectl -n ingress-nginx patch deployment ingress-nginx-controller --type=json \
#                       -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--enable-ssl-passthrough"}]'
#   3. Install chart: helm install netweave . -f values-local.yaml -n netweave --create-namespace
#   4. Setup certs:   netweave-cli setup certs
#   5. Add to /etc/hosts: 127.0.0.1 admin.netweave.local api.netweave.local auth.netweave.local

# Gateway - single replica, local image
gateway:
  replicaCount: 1
  image:
    registry: ""
    repository: netweave-gateway
    tag: "local"
    pullPolicy: Never
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: false
  affinity: {}
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    hosts:
      - host: api.netweave.local
        paths:
          - path: /
            pathType: Prefix
  keycloakClient:
    additionalRedirectUris:
      - "https://api.netweave.local/*"
    additionalWebOrigins:
      - "https://api.netweave.local"
  config:
    logLevel: debug
    # Multi-tenancy enabled with mTLS auth enforcement
    multiTenancy:
      enabled: true
      requireMTLS: true
      initializeDefaultRoles: true
    # Auth store backend using Keycloak
    auth:
      backend: keycloak
      keycloak:
        realm: netweave
        clientID: netweave-gateway
        clientSecretEnvVar: KEYCLOAK_CLIENT_SECRET
        adminUsername: admin
        adminPasswordEnvVar: KEYCLOAK_ADMIN_PASSWORD
        timeout: 30s
    # OAuth2 enabled for admin portal Bearer token auth
    oauth2:
      enabled: true
      autoProvisionUsers: true
      defaultRole: platform-admin
    # TLS enabled with mTLS client cert verification
    tls:
      enabled: true
      certFile: /etc/netweave/tls/tls.crt
      keyFile: /etc/netweave/tls/tls.key
      caFile: /etc/netweave/tls/ca.crt
      clientAuth: "verify"
      minVersion: "1.3"
      existingServerSecret: "netweave-tls-server"
      existingCAConfigMap: "netweave-tls-ca"

# Admin Portal - single replica, local image
adminPortal:
  enabled: true
  replicas: 1
  image:
    repository: netweave-admin-portal
    tag: "local"
    pullPolicy: Never
  keycloak:
    issuer: "https://auth.netweave.local/realms/netweave"
    additionalRedirectUris:
      - "https://admin.netweave.local/*"
    additionalWebOrigins:
      - "https://admin.netweave.local"
  authUrl: "https://admin.netweave.local"
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    hosts:
      - host: admin.netweave.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: admin-portal-ingress-tls
        hosts:
          - admin.netweave.local
  # Trust the Vault CA so Node.js can verify TLS when reaching Keycloak via ingress.
  trustCA: "netweave-tls-ca"
  # Resolve ingress hostnames from inside the pod for OIDC discovery.
  # Set the IP to the NGINX ingress controller's ClusterIP:
  #   kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.spec.clusterIP}'
  hostAliases:
    - ip: "10.96.37.177"
      hostnames:
        - auth.netweave.local
        - api.netweave.local

# PostgreSQL - official image, small
postgresql:
  enabled: true
  replicas: 1
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    username: keycloak
    password: "dev-password-123"
    database: keycloak
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Keycloak - production mode, single replica
keycloak:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0"
  devMode: false
  proxy: "xforwarded"
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    hosts:
      - host: auth.netweave.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: keycloak-ingress-tls
        hosts:
          - auth.netweave.local
  auth:
    adminUser: admin
    adminPassword: "admin"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# Vault - deployed via netweave-cli setup vault (production mode with TLS + file storage)
vault:
  enabled: true
  replicaCount: 1
  deployViaManifests: true
  namespace: netweave
  skipTLSVerify: true
  caCert: false

# Redis - official image, small
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  auth:
    enabled: true
    password: "dev-redis-123"
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Init jobs - disable vault PKI for local dev (run manually)
initJobs:
  keycloakRealm:
    enabled: true
  keycloakConfig:
    enabled: true
  vaultPKI:
    enabled: false

# Secrets managed by Helm
secrets:
  create: true

# No network policies for local dev
networkPolicy:
  enabled: false

# No monitoring for local dev
monitoring:
  enabled: false
