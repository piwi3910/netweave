services:
  # PostgreSQL for Keycloak
  postgres:
    image: postgres:16-alpine
    container_name: netweave-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netweave-backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Vault with TLS
  vault:
    image: hashicorp/vault:1.18.3
    container_name: netweave-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_SKIP_VERIFY: "true"
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./deployments/docker/vault/config:/vault/config:ro
      - ./deployments/docker/vault/tls:/vault/tls:ro
    command: server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --no-verbose --tries=1 --spider https://localhost:8200/v1/sys/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - netweave-backend
    security_opt:
      - no-new-privileges:true
    user: "100:1000"

  # Vault Init (one-time initialization)
  vault-init:
    image: hashicorp/vault:1.18.3
    container_name: netweave-vault-init
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_SKIP_VERIFY: "true"
    volumes:
      - ./deployments/docker/vault/scripts:/vault/scripts:ro
      - vault_init:/vault/init
    command: >
      sh -c "
        echo 'Waiting for Vault to be ready...';
        until wget --no-check-certificate --spider -q https://vault:8200/v1/sys/health 2>/dev/null; do
          sleep 2;
        done;
        echo 'Vault is ready. Initializing...';
        /vault/scripts/init.sh
      "
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - netweave-backend
    security_opt:
      - no-new-privileges:true

  # Keycloak with PostgreSQL
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: netweave-keycloak
    command:
      - start
      - --import-realm
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/postgres_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8443
      KC_HOSTNAME_STRICT: false
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls.key
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_LOG_LEVEL: INFO
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
    secrets:
      - postgres_password
      - keycloak_admin_password
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deployments/keycloak/realm-import:/opt/keycloak/data/import:ro
      - ./deployments/docker/keycloak/tls:/opt/keycloak/conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8443"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - netweave-backend
    security_opt:
      - no-new-privileges:true

  # Redis with TLS
  redis:
    image: redis:7.4-alpine
    container_name: netweave-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --tls-port 6380
      --port 0
      --tls-cert-file /tls/tls.crt
      --tls-key-file /tls/tls.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients no
    ports:
      - "127.0.0.1:6380:6380"
    volumes:
      - redis_data:/data
      - ./deployments/docker/redis/tls:/tls:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/tls/ca.crt", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netweave-backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
    driver: local
  vault_data:
    driver: local
  vault_logs:
    driver: local
  vault_init:
    driver: local
  redis_data:
    driver: local

networks:
  netweave-backend:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.28.0.0/16

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
